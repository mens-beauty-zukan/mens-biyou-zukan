<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンズ肌質診断 | メンズ美容図鑑</title>
<meta name="description" content="10問で本当の肌タイプを診断。インナードライ・混合肌・敏感ニキビ肌など8タイプを多軸スコアで正確に判定。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0b;
  --card:#141a14;
  --card-border:#2a3d2e;
  --accent:#1db954;
  --accent-dark:#158a3e;
  --accent-glow:rgba(29,185,84,.12);
  --text-hi:rgba(255,255,255,.9);
  --text-mid:rgba(255,255,255,.55);
  --text-lo:rgba(255,255,255,.28);
  --border-lo:rgba(255,255,255,.08);
  --border-mid:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text-hi);font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}

/* ── NAV ── */
nav{background:rgba(13,13,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-lo);position:sticky;top:0;z-index:100;}
.nav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;color:var(--text-hi);text-decoration:none;display:flex;align-items:center;gap:10px;}
.logo span{font-family:'Noto Sans JP',sans-serif;font-size:10px;font-weight:400;color:var(--text-lo);letter-spacing:.04em;border-left:1px solid var(--border-lo);padding-left:10px;}
.nav-badge{font-size:10px;letter-spacing:.08em;color:var(--accent);border:1px solid rgba(29,185,84,.3);padding:3px 10px;border-radius:99px;}

/* ── HERO ── */
.hero{padding:60px 20px 48px;text-align:center;border-bottom:1px solid var(--border-lo);}
.hero-eye{font-size:10px;letter-spacing:.2em;color:var(--text-lo);text-transform:uppercase;margin-bottom:18px;}
.hero h1{font-family:'Noto Sans JP',sans-serif;font-size:clamp(24px,5vw,36px);font-weight:900;line-height:1.25;margin-bottom:14px;letter-spacing:.01em;}
.hero h1 em{color:var(--accent);font-style:normal;}
.hero-sub{font-size:13px;color:var(--text-mid);line-height:1.9;max-width:480px;margin:0 auto 28px;}
.hero-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.htag{font-size:11px;padding:4px 14px;border:1px solid var(--border-mid);color:var(--text-lo);border-radius:99px;letter-spacing:.04em;}
.htag.hi{border-color:rgba(29,185,84,.35);color:var(--accent);}

/* ── MAIN CARD ── */
.main{max-width:680px;margin:0 auto;padding:40px 20px 80px;}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:36px 40px;box-shadow:0 0 0 1px rgba(29,185,84,.04),0 24px 48px rgba(0,0,0,.4);}
@media(max-width:600px){.card{padding:24px 18px;border-radius:14px;}}

/* カードヘッダー */
.card-head{margin-bottom:0;}
.card-title{font-family:'Noto Sans JP',sans-serif;font-size:20px;font-weight:900;color:var(--accent);letter-spacing:.01em;margin-bottom:4px;}
.card-desc{font-size:12px;color:var(--text-lo);line-height:1.7;}

/* プログレス */
.prog-wrap{margin:22px 0;}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-lo);margin-bottom:7px;}
.prog-track{height:2px;background:var(--border-lo);border-radius:1px;position:relative;}
.prog-fill{height:2px;background:var(--accent);border-radius:1px;position:absolute;top:0;left:0;transition:width .45s cubic-bezier(.4,0,.2,1);}

/* 質問 */
.q-sect{font-size:10px;letter-spacing:.14em;color:var(--accent);opacity:.7;margin-bottom:8px;font-weight:500;}
.q-text{font-size:19px;font-weight:700;color:var(--text-hi);line-height:1.45;margin-bottom:5px;}
.q-sub{font-size:12px;color:var(--text-lo);margin-bottom:22px;line-height:1.7;}

/* 選択肢 */
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:26px;}
.ch{display:flex;align-items:center;gap:15px;padding:15px 18px;border-radius:10px;border:1px solid var(--border-lo);background:rgba(255,255,255,.025);cursor:pointer;transition:border-color .15s,background .15s;text-align:left;font-family:'Noto Sans JP',sans-serif;width:100%;min-height:58px;}
.ch:hover{border-color:rgba(29,185,84,.45);background:rgba(29,185,84,.04);}
.ch.sel{border-color:var(--accent);background:rgba(29,185,84,.07);}
.dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
.ch:hover .dot{border-color:rgba(29,185,84,.55);}
.ch.sel .dot{border-color:var(--accent);}
.dot-in{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none;}
.ch.sel .dot-in{display:block;}
.ch-text{flex:1;}
.ch-lbl{font-size:14px;font-weight:700;color:var(--text-hi);display:block;line-height:1.4;}
.ch-hint{font-size:11px;color:var(--text-lo);display:block;margin-top:3px;}

/* ナビ */
.nav-btns{display:flex;gap:10px;align-items:center;}
.btn-next{padding:11px 26px;border:none;background:var(--accent-dark);color:#fff;font-size:13px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:8px;letter-spacing:.04em;transition:opacity .15s;}
.btn-next:disabled{opacity:.18;cursor:default;}
.btn-back{padding:11px 14px;border:1px solid var(--border-mid);background:transparent;color:var(--text-lo);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:8px;transition:all .15s;}
.btn-back:hover{color:var(--text-mid);border-color:var(--border-mid);}

/* ローディング */
.loading{text-align:center;padding:48px 0;}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px;}
.dots span{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:dp 1.4s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.22s;}
.dots span:nth-child(3){animation-delay:.44s;}
@keyframes dp{0%,100%{opacity:.2;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
.loading p{font-size:13px;color:var(--text-lo);}

/* ── 結果 ── */
.result{animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.r-label{font-size:10px;letter-spacing:.12em;color:var(--text-lo);margin-bottom:12px;text-transform:uppercase;}

/* 肌タイプバッジ */
.type-badge-wrap{text-align:center;padding:24px 16px;border-radius:14px;margin-bottom:20px;}
.type-badge{display:inline-block;font-size:22px;font-weight:900;padding:9px 28px;border-radius:99px;border-width:2px;border-style:solid;margin-bottom:10px;letter-spacing:.04em;}
.type-en{font-size:11px;letter-spacing:.1em;opacity:.55;margin-bottom:14px;}
.type-desc{font-size:13px;color:rgba(255,255,255,.7);line-height:1.9;text-align:left;max-width:460px;margin:0 auto;}

/* インナードライ警告 */
.innerdry-alert{background:rgba(245,196,0,.07);border:1px solid rgba(245,196,0,.3);border-radius:10px;padding:13px 16px;font-size:12px;color:rgba(245,196,0,.9);line-height:1.85;margin-bottom:18px;}

/* 多軸スコア */
.axes-title{font-size:11px;color:var(--text-lo);letter-spacing:.08em;margin-bottom:14px;}
.axis-row{margin-bottom:14px;}
.axis-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.axis-name{color:var(--text-mid);}
.axis-val{color:var(--text-lo);}
.axis-track{height:4px;background:var(--border-lo);border-radius:2px;overflow:hidden;}
.axis-fill{height:100%;border-radius:2px;transition:width .85s cubic-bezier(.4,0,.2,1);}

/* アドバイス */
.ai-head{font-size:11px;color:var(--text-lo);letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
.ai-pill{font-size:10px;background:var(--accent-dark);color:#fff;padding:2px 8px;border-radius:4px;letter-spacing:.04em;}
.ai-body{font-size:12px;color:var(--text-mid);line-height:1.95;padding:14px 16px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);white-space:pre-wrap;}

/* アクション */
.r-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.btn-retry{padding:9px 18px;border:1px solid var(--border-mid);background:transparent;color:var(--text-lo);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:8px;transition:all .15s;}
.btn-retry:hover{color:var(--text-mid);border-color:rgba(255,255,255,.25);}

/* セクション区切り */
.sec-div{height:1px;background:var(--border-lo);margin:22px 0;}

/* ── フッター ── */
footer{border-top:1px solid var(--border-lo);padding:28px 20px;text-align:center;}
.foot-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--text-lo);margin-bottom:8px;}
.foot-txt{font-size:11px;color:rgba(255,255,255,.18);line-height:1.8;}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="logo" href="#">MENS BIYOU ZUKAN <span>肌診断</span></a>
    <span class="nav-badge">FREE · 10 QUESTIONS</span>
  </div>
</nav>

<div class="hero">
  <p class="hero-eye">Skin Type Diagnosis</p>
  <h1><em>本当の肌タイプ</em>を<br>10問で正確に診断する</h1>
  <p class="hero-sub">感覚じゃなく、皮脂・水分・バリア・敏感度を独立スコアリング。インナードライや敏感ニキビ肌も見逃さない。</p>
  <div class="hero-tags">
    <span class="htag hi">8タイプ判定</span>
    <span class="htag hi">多軸スコア</span>
    <span class="htag hi">AIアドバイス</span>
    <span class="htag">登録不要</span>
    <span class="htag">約2分</span>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-head">
      <div class="card-title">プロレベルの肌質診断</div>
      <div class="card-desc">皮脂・水分・バリア・敏感度・生活習慣を5軸で評価。8タイプから最も近い肌質を特定します。</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-meta">
        <span id="prog-label">質問 1 / 10</span>
        <span id="prog-sect">皮脂分泌</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:5%"></div></div>
    </div>
    <div id="q-area"></div>
  </div>
</div>

<footer>
  <div class="foot-logo">MENS BIYOU ZUKAN</div>
  <p class="foot-txt">本診断は一般的な美容情報に基づく参考情報です。医療的な診断ではありません。</p>
</footer>

<script>
/* ═══════════════════════════════════════
   10問 × 多軸スコアリング設計
   各質問が独立した軸に貢献する
═══════════════════════════════════════ */
const QS = [
  {
    id:'q1', sect:'皮脂分泌 — 全体', lbl:'Q1 / 10',
    q:'朝起きたとき、顔全体の皮脂感は？',
    sub:'洗顔前・何もつけていない素の状態で答えてください。',
    axis:'sebum_all',
    ch:[
      {l:'カサカサしてつっぱる感じ', h:'皮脂・水分ともに少ない', v:0},
      {l:'さらっとしていてベタつかない', h:'バランスが良い', v:1},
      {l:'少しベタっとする', h:'やや皮脂多め', v:2},
      {l:'ベタついてテカテカしている', h:'皮脂分泌が多い', v:3},
    ]
  },
  {
    id:'q2', sect:'部位差 — T / U ゾーン', lbl:'Q2 / 10',
    q:'おでこ・鼻（Tゾーン）と頬（Uゾーン）で差がある？',
    sub:'混合肌の判定に直結する重要な質問です。',
    axis:'zone_diff',
    ch:[
      {l:'どこも均一に乾燥する', h:'全体的に乾燥寄り', v:0},
      {l:'全体的に均一で差はほぼない', h:'バランス型', v:1},
      {l:'Tゾーンだけテカり、頬は普通〜乾燥気味', h:'混合肌の可能性大', v:2},
      {l:'Tゾーンが激しくテカり、頬もベタつく', h:'全体的に皮脂多め', v:3},
    ]
  },
  {
    id:'q3', sect:'水分・バリア機能', lbl:'Q3 / 10',
    q:'洗顔後、何もつけずに放置するとどうなる？',
    sub:'スキンケアなしの素の反応を思い浮かべてください。',
    axis:'moisture',
    ch:[
      {l:'5分以内に強いつっぱりを感じる', h:'水分不足・バリア機能低下', v:0},
      {l:'10分ほどでじわじわつっぱる', h:'やや乾燥傾向', v:1},
      {l:'15分以上快適なまま', h:'水分バランスが良い', v:2},
      {l:'つっぱらず、むしろテカリが出てくる', h:'皮脂分泌が活発', v:3},
    ]
  },
  {
    id:'q4', sect:'インナードライ確認', lbl:'Q4 / 10',
    q:'「テカるのに乾燥もする」と感じることがある？',
    sub:'インナードライ肌（乾燥性脂性肌）の識別に最も重要な質問です。',
    axis:'innerdry',
    ch:[
      {l:'テカるけど保湿しないとゴワつき・乾燥も感じる', h:'インナードライの可能性大', v:10},
      {l:'テカりはあるが乾燥感はほぼない', h:'脂性肌寄り', v:0},
      {l:'テカリ自体があまりない', h:'乾燥〜普通肌寄り', v:0},
      {l:'どちらとも言えない・わからない', h:'', v:5},
    ]
  },
  {
    id:'q5', sect:'敏感度・バリア', lbl:'Q5 / 10',
    q:'肌のかゆみ・赤み・ヒリヒリはどのくらい出る？',
    sub:'ケアをしていない普段の状態を基準にしてください。',
    axis:'sensitivity',
    ch:[
      {l:'全くない', h:'バリア機能が良好', v:0},
      {l:'たまにある（月に数回程度）', h:'やや敏感', v:1},
      {l:'よくある（週1〜2回以上）', h:'敏感肌の傾向', v:2},
      {l:'ほぼ毎日・かなり頻繁', h:'バリア機能が低下している可能性', v:3},
    ]
  },
  {
    id:'q6', sect:'毛穴・ニキビ', lbl:'Q6 / 10',
    q:'毛穴の目立ちとニキビの状態は？',
    sub:'鏡を近づけて見たときの状態で答えてください。',
    axis:'pores',
    ch:[
      {l:'毛穴はほぼ目立たず、ニキビもほとんど出ない', h:'皮脂バランス良好', v:0},
      {l:'毛穴が少し開いている。ニキビは月1〜2個程度', h:'軽度の皮脂過多', v:1},
      {l:'毛穴がはっきり開いている。ニキビが3〜5個ある', h:'皮脂づまりが多め', v:2},
      {l:'黒ずみ毛穴が多い。ニキビが慢性的に出る', h:'皮脂分泌が盛ん', v:3},
    ]
  },
  {
    id:'q7', sect:'保湿後の変化', lbl:'Q7 / 10',
    q:'保湿した2〜3時間後の肌はどうなっている？',
    sub:'普段使っているケアをした後の状態で答えてください。',
    axis:'after_care',
    ch:[
      {l:'またすぐ乾燥・つっぱりを感じる', h:'水分が逃げやすい・バリア弱め', v:0},
      {l:'しっとりが長時間持続する', h:'保湿ケアが機能している', v:1},
      {l:'少しテカってくる', h:'皮脂が出やすい', v:2},
      {l:'かなりベタっとなる', h:'過剰な皮脂分泌', v:3},
    ]
  },
  {
    id:'q8', sect:'肌の季節変化', lbl:'Q8 / 10',
    q:'冬と夏で肌の状態はどのくらい変わる？',
    sub:'季節による変化はバリア機能の指標になります。',
    axis:'seasonal',
    ch:[
      {l:'冬は激しく乾燥、夏はほぼ問題ない', h:'バリア機能が季節に依存している', v:0},
      {l:'冬はやや乾燥するが夏はテカる', h:'混合肌・季節で変動', v:1},
      {l:'年中ほぼ同じ状態', h:'バリア機能が安定している', v:2},
      {l:'夏は特にテカりがひどい', h:'皮脂分泌が気温に反応しやすい', v:3},
    ]
  },
  {
    id:'q9', sect:'睡眠・水分摂取', lbl:'Q9 / 10',
    q:'睡眠と水分補給の状態は？',
    sub:'生活習慣は肌のバリア機能と皮脂分泌に直接影響します。',
    axis:'lifestyle',
    ch:[
      {l:'睡眠5時間未満 かつ 水分をほぼ飲まない', h:'肌への負担が大きい状態', v:0},
      {l:'どちらか一方は十分できていない', h:'改善の余地あり', v:1},
      {l:'睡眠6〜7時間、水分は1L前後', h:'概ね良好', v:2},
      {l:'睡眠7時間以上 かつ 水分1.5L以上こまめに補給', h:'肌に良い生活習慣', v:3},
    ]
  },
  {
    id:'q10', sect:'現在のスキンケア', lbl:'Q10 / 10',
    q:'今のスキンケアルーティンは？',
    sub:'毎日続けているものを選んでください。',
    axis:'routine',
    ch:[
      {l:'洗顔のみ（保湿なし）', h:'保湿不足の可能性', v:0},
      {l:'洗顔＋化粧水', h:'基本的なケア', v:1},
      {l:'洗顔＋化粧水＋乳液・クリーム', h:'しっかりした保湿', v:2},
      {l:'美容液・複数アイテムを使用', h:'本格的なケア', v:3},
    ]
  },
];

/* ═══════════════════════════════════════
   8タイプ定義
═══════════════════════════════════════ */
const TYPES = {
  innerdry:{
    label:'インナードライ肌', en:'Inner Dry (Combination Dry)',
    color:'#f5c400', bg:'rgba(245,196,0,.09)', border:'rgba(245,196,0,.38)',
    desc:'テカりがあるのに奥では乾燥している、最も誤解されやすい肌タイプ。皮脂を出してバリアを作ろうとしているサインで、油分カットのケアは逆効果。水分補給と保湿の強化が最優先です。',
    warn:true,
    ngcare:'皮脂を落とそうとして洗顔を1日3回以上したり、ノンオイルのさっぱり系化粧水だけで済ませると乾燥が加速します。',
  },
  oily_acne:{
    label:'脂性ニキビ肌', en:'Oily Acne-Prone Skin',
    color:'#c084fc', bg:'rgba(192,132,252,.08)', border:'rgba(192,132,252,.35)',
    desc:'皮脂分泌が多く、毛穴づまりやニキビが繰り返しやすいタイプ。薬用成分（サリチル酸・グリチルリチン酸）で皮脂とニキビを同時にケアする化粧水が必要です。',
    warn:false,
    ngcare:'保湿力が高すぎる化粧水（ヒアルロン酸系の高粘度タイプ）は毛穴を詰まらせニキビを悪化させることがあります。',
  },
  sensitive_acne:{
    label:'敏感ニキビ肌', en:'Sensitive Acne-Prone Skin',
    color:'#fb923c', bg:'rgba(251,146,60,.08)', border:'rgba(251,146,60,.35)',
    desc:'敏感肌なのにニキビも出るという難しい肌タイプ。刺激の強い薬用成分は使えないため、低刺激処方でニキビケアできる数少ない選択肢から選ぶ必要があります。',
    warn:false,
    ngcare:'アルコール含有の薬用化粧水は敏感肌のヒリヒリを悪化させます。「薬用＝良い」という思い込みに注意。',
  },
  sensitive:{
    label:'敏感肌', en:'Sensitive Skin',
    color:'#34d399', bg:'rgba(52,211,153,.08)', border:'rgba(52,211,153,.35)',

/* ═══════════════════════════════════════
   スコア計算・タイプ判定
═══════════════════════════════════════ */
function calcScores(ans){
  const r = {};
  QS.forEach(q=>{ if(ans[q.id] !== undefined) r[q.axis] = q.ch[ans[q.id]].v; });

  const sebum    = r.sebum_all  ?? 0;
  const zoneDiff = r.zone_diff  ?? 0;
  const moisture = 3 - (r.moisture ?? 0);   // 高いほど乾燥
  const innerdry = (r.innerdry  ?? 0) === 10;
  const innerdryPartial = (r.innerdry ?? 0) === 5;
  const sens     = r.sensitivity ?? 0;
  const pores    = r.pores       ?? 0;
  const afterCare= r.after_care  ?? 0;
  const seasonal = r.seasonal    ?? 0;
  const lifestyle= r.lifestyle   ?? 0;
  const routine  = r.routine     ?? 0;

  // 複合スコア
  const sebumScore  = Math.round(((sebum + pores + afterCare * 0.5) / 8.5) * 100);
  const dryScore    = Math.round(((moisture + (seasonal===0?2:0) + (routine===0?1:0)) / 6) * 100);
  const sensScore   = Math.round((sens / 3) * 100);
  const lifeScore   = Math.round((lifestyle / 3) * 100);
  const barrierScore= Math.round(((3-moisture + routine) / 6) * 100);

  return {
    sebum, zoneDiff, moisture, innerdry, innerdryPartial,
    sens, pores, afterCare, seasonal, lifestyle, routine, r,
    axes:{
      sebumScore: Math.min(sebumScore, 100),
      dryScore:   Math.min(dryScore, 100),
      sensScore,
      lifeScore,
      barrierScore,
    }
  };
}

function classifyType(sc){
  const {sebum, zoneDiff, moisture, innerdry, innerdryPartial, sens, pores} = sc;

  // 1. インナードライ（最優先で確認）
  if(innerdry) return TYPES.innerdry;
  if(innerdryPartial && sebum >= 2 && moisture >= 1) return TYPES.innerdry;

  // 2. 敏感ニキビ（敏感×ニキビの複合）
  if(sens >= 2 && pores >= 2) return TYPES.sensitive_acne;

  // 3. 敏感肌
  if(sens >= 2) return TYPES.sensitive;

  // 4. 脂性ニキビ
  if(sebum >= 2 && pores >= 2) return TYPES.oily_acne;

  // 5. 混合肌（ゾーン差が決め手）
  if(zoneDiff === 2) return TYPES.combo;

  // 6. オイリー
  if(sebum >= 2 || (sebum >= 1 && pores >= 2)) return TYPES.oily;

  // 7. 乾燥肌
  if(moisture >= 2 || sebum === 0) return TYPES.dry;

  // 8. 普通肌
  return TYPES.normal;
}

/* ═══════════════════════════════════════
   UI ロジック
═══════════════════════════════════════ */
let ans = {}, cur = 0;

function renderQ(i){
  const q = QS[i];
  const pct = Math.round((i / QS.length) * 100) + 5;
  document.getElementById('prog-fill').style.width = Math.min(pct, 95) + '%';
  document.getElementById('prog-label').textContent = `質問 ${i+1} / ${QS.length}`;
  document.getElementById('prog-sect').textContent  = q.sect;

  const sel = ans[q.id];
  const isLast = i === QS.length - 1;

  document.getElementById('q-area').innerHTML = `
    <div style="animation:fadeUp .28s ease">
      <div class="q-sect">${q.sect}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-sub">${q.sub}</div>
      <div class="choices">
        ${q.ch.map((c,ci) => `
          <button class="ch ${sel===ci?'sel':''}" id="ch${ci}" onclick="pick('${q.id}',${ci},${q.ch.length})">
            <div class="dot"><div class="dot-in"></div></div>
            <div class="ch-text">
              <span class="ch-lbl">${c.l}</span>
              ${c.h?`<span class="ch-hint">${c.h}</span>`:''}
            </div>
          </button>`).join('')}
      </div>
      <div class="nav-btns">
        ${i>0?'<button class="btn-back" onclick="goBack()">← 戻る</button>':''}
        <button class="btn-next" id="btn-next" onclick="goNext()" ${sel!==undefined?'':'disabled'}>
          ${isLast ? '診断する →' : '次へ →'}
        </button>
      </div>
    </div>`;
}

function pick(qid, ci, total){
  ans[qid] = ci;
  for(let i=0;i<total;i++) document.getElementById('ch'+i)?.classList.remove('sel');
  document.getElementById('ch'+ci)?.classList.add('sel');
  document.getElementById('btn-next').disabled = false;
}
function goNext(){
  if(ans[QS[cur].id] === undefined) return;
  cur++;
  if(cur >= QS.length) showLoading();
  else renderQ(cur);
}
function goBack(){
  if(cur > 0){ cur--; renderQ(cur); }
}

function showLoading(){
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = '分析中…';
  document.getElementById('prog-sect').textContent  = '';
  document.getElementById('q-area').innerHTML = `
    <div class="loading">
      <div class="dots"><span></span><span></span><span></span></div>
      <p>肌質を多軸で分析しています…</p>
    </div>`;
  setTimeout(showResult, 1300);
}

function drawRadar(canvasId, scores){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2, r = cx - 36;
  const labels = ['皮脂','乾燥','敏感','バリア','生活'];
  const vals   = scores; // 0〜100
  const N = labels.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // グリッド
  [0.25,0.5,0.75,1].forEach(ratio=>{
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const angle = (Math.PI*2/N)*i - Math.PI/2;
      const x = cx + r*ratio*Math.cos(angle);
      const y = cy + r*ratio*Math.sin(angle);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // 軸線
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(angle), cy+r*Math.sin(angle));
    ctx.strokeStyle='rgba(255,255,255,.1)';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // データ塗り
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const v = vals[i]/100;
    const x = cx + r*v*Math.cos(angle);
    const y = cy + r*v*Math.sin(angle);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(29,185,84,.2)';
  ctx.fill();
  ctx.strokeStyle = '#1db954';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 頂点ドット
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const v = vals[i]/100;
    ctx.beginPath();
    ctx.arc(cx+r*v*Math.cos(angle), cy+r*v*Math.sin(angle), 4,0,Math.PI*2);
    ctx.fillStyle='#1db954';
    ctx.fill();
  }

  // ラベル
  ctx.font = '500 11px Noto Sans JP, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const lx = cx + (r+22)*Math.cos(angle);
    const ly = cy + (r+22)*Math.sin(angle);
    ctx.fillText(labels[i], lx, ly);
  }
}

function drawSkinMap(canvasId, sc){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // 顔のシルエット（楕円）
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.48, w*0.34, h*0.44, 0, 0, Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.18)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.03)';
  ctx.fill();

  function heatColor(v, alpha){
    if(v>66) return `rgba(29,185,84,${alpha})`;   // 良好：緑
    if(v>33) return `rgba(245,196,0,${alpha})`;   // 中間：黄
    return `rgba(248,113,113,${alpha})`;           // 要注意：赤
  }

  // Tゾーン（おでこ〜鼻）
  const tScore = 100 - sc.axes.sebumScore; // 低皮脂=良い
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.3, w*0.13, h*0.12, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(tScore, 0.55);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.52, w*0.07, h*0.1, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(tScore, 0.55);
  ctx.fill();

  // Uゾーン（頬）
  const uScore = 100 - sc.axes.dryScore;
  ctx.beginPath();
  ctx.ellipse(w*0.33, h*0.52, w*0.1, h*0.13, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(uScore, 0.55);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w*0.67, h*0.52, w*0.1, h*0.13, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(uScore, 0.55);
  ctx.fill();

  // あご
  const chinScore = 100 - Math.max(sc.axes.sebumScore, sc.axes.dryScore)/2;
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.78, w*0.1, h*0.07, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(chinScore, 0.45);
  ctx.fill();

  // ラベル
  ctx.font = '700 10px Noto Sans JP, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText('Tゾーン', w/2, h*0.18);
  ctx.fillText('頬(L)', w*0.16, h*0.52);
  ctx.fillText('頬(R)', w*0.84, h*0.52);
  ctx.fillText('あご', w/2, h*0.91);

  // 凡例
  ctx.font='9px Noto Sans JP, sans-serif';
  [[29,185,84,'良好'],[245,196,0,'注意'],[248,113,113,'要ケア']].forEach(([r,g,b,t],i)=>{
    const lx=6, ly=h-38+i*13;
    ctx.fillStyle=`rgba(${r},${g},${b},.8)`;
    ctx.fillRect(lx,ly,8,8);
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.textAlign='left';
    ctx.fillText(t,lx+11,ly+7);
  });
}

      <div class="axis-meta">
        <span class="axis-name">${a.name}</span>
        <span class="axis-val">${a.pct}%</span>
      </div>
      <div class="axis-track">
        <div class="axis-fill" style="width:0%;background:${a.color}" data-target="${a.pct}"></div>
      </div>
    </div>`).join('')}
  </div>

  <div class="sec-div"></div>

  <!-- おすすめ化粧水 -->
  <div style="margin-bottom:20px;">
    <div style="font-size:10px;color:var(--text-lo);letter-spacing:.08em;margin-bottom:14px;">あなたの肌タイプに合う化粧水</div>
    ${prods.map(p=>`
    <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;border:1px solid ${p.rank===1?type.border:'var(--border-lo)'};background:${p.rank===1?type.bg:'rgba(255,255,255,.02)'};margin-bottom:8px;">
      <span style="font-size:20px;flex-shrink:0;">${getRankIcon(p.rank)}</span>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">
          <span style="${getTagStyle(p.rank)}font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.04em;">${p.tag}</span>
          <span style="font-size:10px;color:var(--text-lo);">${p.brand}</span>
          ${p.price&&p.price!=='—'?`<span style="font-size:11px;color:${p.rank===1?type.color:'var(--text-lo)'};font-weight:700;margin-left:auto;">${p.price}</span>`:''}
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--text-hi);line-height:1.4;">${p.label}</div>
        <div style="font-size:11px;color:var(--text-mid);margin-top:3px;line-height:1.5;">${p.point}</div>
      </div>
    </div>`).join('')}
  </div>

  <div class="sec-div"></div>

  <!-- NGケア -->
  <div class="ai-head">NG ケア <span class="ai-pill" style="background:#7f1d1d;">要注意</span></div>
  <div class="ai-body" id="ng-box">${type.ngcare}</div>

  <div class="sec-div"></div>

  <!-- アドバイス -->
  <div class="ai-head">パーソナルアドバイス</div>
  <div class="ai-body" id="ai-box"></div>

  <div class="r-actions">
    <button class="btn-retry" onclick="restart()">← もう一度診断する</button>
  </div>
</div>`;

  // バーアニメーション
  setTimeout(()=>{
    document.querySelectorAll('.axis-fill').forEach(el=>{
      el.style.width = el.dataset.target+'%';
    });
    drawRadar('radar', radarVals);
    drawSkinMap('skinmap', sc);
  }, 80);

  fetchAdvice(type, sc);
}

function fetchAdvice(type, sc){
  const ADVICE = {
    innerdry:`今すぐやめるべきは「皮脂が多いから」という理由での洗顔回数の増加と、ノンオイル・さっぱり系だけで済ませるケアです。インナードライは表面の油分に騙されがちですが、肌の内側は水分不足の状態。最優先ケアは化粧水をたっぷり重ねづけして水分を補給すること。成分はヒアルロン酸・グリセリン・セラミドを含む水分重視の化粧水を選び、テクスチャーはさっぱり〜普通タイプが合います。乳液で蓋をすることも忘れずに。1ヶ月続ければテカりが落ち着いてくる人が多く、「テカるから何もしない」から「保湿するからテカらない」へと体感が変わっていきます。`,

    oily_acne:`最優先は洗顔の見直しです。皮脂を落とそうと1日3回以上洗顔している人は今日から朝晩2回に抑えてください。洗いすぎがバリアを壊し、さらに皮脂を分泌させる悪循環を生んでいます。化粧水は薬用（医薬部外品）表記があり、グリチルリチン酸・サリチル酸・ビタミンC誘導体のいずれかを含むさっぱりタイプを選んでください。高粘度のとろみ系・ヒアルロン酸系は毛穴を詰まらせるリスクがあるので今は避けましょう。1ヶ月後には毛穴のつまりが減り、ニキビの頻度が明らかに落ちている状態を目指せます。`,

    sensitive_acne:`刺激を与えないことが最大の優先事項です。アルコール・香料・着色料が入った化粧水は今すぐ使用を中断してください。ニキビがあっても敏感肌の場合、薬用成分の刺激で肌がさらに荒れることがあります。低刺激処方（アルコールフリー・無香料・無着色）でありながらニキビケア成分（グリチルリチン酸・ティーツリー）を含む化粧水を探しましょう。洗顔は摩擦ゼロを意識し、泡で包むように優しく洗うことが基本です。1ヶ月で赤みと肌荒れが落ち着き、ニキビができにくい土台ができていきます。`,

    sensitive:`バリア機能の回復が最優先です。今使っている化粧水の成分表を確認し、エタノール（アルコール）が上位に記載されているなら切り替えを検討してください。セラミド・コラーゲン・ナイアシンアミドなどバリア補強成分を含む低刺激処方が最適です。洗顔は朝は水洗いのみにする方法も有効で、摩擦を極力ゼロにすることが回復への近道。テクスチャーはとろみのあるしっとりタイプが肌に密着しやすく、揮発による乾燥も防げます。1ヶ月でヒリヒリ・赤みの頻度が明らかに減少していきます。`,

    combo:`部位別ケアへの切り替えが最も効果的です。Tゾーン（おでこ・鼻）にはさっぱり系・皮脂ケア成分入りを少量、Uゾーン（頬・あご）には保湿系をたっぷりと使い分けてください。同じ化粧水を全顔に同量塗るのが混合肌の最大のNGです。1本で済ませたい場合はバランス型の化粧水（IPSAのタイムRアクアなど混合肌向け設計）を選びましょう。成分はBHA（サリチル酸）配合でテクスチャーが軽めのものを。1ヶ月後にはTゾーンのテカりが抑えられ、頬の乾燥感もなくなったバランスの取れた肌になれます。`,

    oily:`洗顔の質と回数を整えることが第一歩です。現在1日3回以上洗顔している場合は朝晩2回に削減してください。化粧水はさっぱりタイプで皮脂ケア成分（BHA・ナイアシンアミド・ビタミンC誘導体）入りを選びましょう。「油分カット＝正解」ではなく、適切な保湿で皮脂の過剰分泌を抑えるのが本来のアプローチです。テクスチャーは水のようなローションタイプが肌に負担なく使えます。毛穴が気になる場合は週1〜2回の酵素洗顔を追加すると詰まりが取れやすくなります。1ヶ月でテカりのピークタイムが遅くなり、昼にベタつく時間が短くなっていきます。`,

    dry:`水分補給を最優先にしたルーティン構築が急務です。現在「保湿が足りていない」と体が感じているサインがつっぱりとして出ています。化粧水はヒアルロン酸・セラミド・コラーゲンを含む高保湿タイプを選び、1回の量をケチらず500円玉大をたっぷり使ってください。その後に乳液またはクリームで蓋をする2ステップが乾燥肌には必須です。洗顔は泡立てた泡で優しく洗い、すすぎはぬるま湯で。熱いお湯は皮脂を落としすぎるので避けましょう。1ヶ月でつっぱり感が朝からなくなり、肌のキメが整ってくる変化を実感できます。`,

    normal:`現状の維持と将来への先行投資が鍵です。今の肌バランスを崩さないよう、スキンケアをシンプルに継続することが最も重要。余裕があればビタミンC誘導体入りの化粧水を取り入れると、毛穴・くすみ・シミの予防効果が期待できます。特に20代のうちからUVケア（日焼け止め）を習慣にすることで、30代以降の肌の差が劇的に変わります。保湿は化粧水＋乳液の2ステップをベースに、乾燥を感じる日は量を増やす柔軟な対応を。1ヶ月後の変化は見えにくいですが、継続することで3ヶ月後・1年後に「やっておいてよかった」と感じる肌になれます。`,
  };

  // typeのkeyを特定
  const key = Object.keys(TYPES).find(k => TYPES[k] === type) || 'normal';

  // 生活習慣スコアが低い場合の追記
  let extra = '';
  if(sc.lifestyle <= 1){
    extra = '\n\nまた、睡眠不足と水分不足は皮脂分泌の乱れとバリア機能低下に直結します。睡眠7時間・水分1.5L/日を意識するだけで、ケアの効果が2倍以上変わります。';
  }

  document.getElementById('ai-box').textContent = (ADVICE[key] || ADVICE.normal) + extra;
}

function restart(){
  ans = {}; cur = 0;
  document.getElementById('prog-fill').style.width = '5%';
  document.getElementById('prog-label').textContent = '質問 1 / 10';
  document.getElementById('prog-sect').textContent = QS[0].sect;
  renderQ(0);
}

renderQ(0);
</script>
</body>
</html>
