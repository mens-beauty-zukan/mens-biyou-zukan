<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンズ肌質診断 | メンズ美容図鑑</title>
<meta name="description" content="12問で本当の肌タイプを診断。インナードライ・混合肌・敏感ニキビ肌など8タイプを多軸スコアで正確に判定。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f0;
  --white:#ffffff;
  --card:#ffffff;
  --accent:#18a349;
  --accent-dark:#128038;
  --accent-light:#eaf7ee;
  --text-hi:#111111;
  --text-mid:#555555;
  --text-lo:#aaaaaa;
  --border:#e8e8e4;
  --shadow:0 2px 16px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text-hi);font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}

/* NAV */
nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.05);}
.nav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;color:var(--text-hi);text-decoration:none;display:flex;align-items:center;gap:10px;}
.logo span{font-family:'Noto Sans JP',sans-serif;font-size:10px;font-weight:400;color:var(--text-lo);letter-spacing:.04em;border-left:1px solid var(--border);padding-left:10px;}
.nav-badge{font-size:10px;letter-spacing:.06em;color:var(--accent);border:1.5px solid var(--accent);padding:3px 12px;border-radius:99px;font-weight:700;}

/* HERO */
.hero{background:#fff;padding:52px 20px 44px;text-align:center;border-bottom:1px solid var(--border);}
.hero-eye{font-size:10px;letter-spacing:.22em;color:var(--text-lo);text-transform:uppercase;margin-bottom:16px;}
.hero h1{font-size:clamp(22px,5vw,34px);font-weight:900;line-height:1.25;margin-bottom:12px;color:var(--text-hi);}
.hero h1 em{color:var(--accent);font-style:normal;}
.hero-sub{font-size:13px;color:var(--text-mid);line-height:1.9;max-width:460px;margin:0 auto 24px;}
.hero-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.htag{font-size:11px;padding:5px 14px;border:1.5px solid var(--border);color:var(--text-lo);border-radius:99px;}
.htag.hi{border-color:var(--accent);color:var(--accent);background:var(--accent-light);font-weight:700;}

/* MAIN */
.main{max-width:680px;margin:0 auto;padding:32px 16px 80px;}

/* 診断カード */
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:36px 40px;box-shadow:var(--shadow);}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px;}}

.card-title{font-size:17px;font-weight:900;color:var(--accent);margin-bottom:3px;}
.card-desc{font-size:12px;color:var(--text-lo);line-height:1.7;}

/* プログレス */
.prog-wrap{margin:20px 0 24px;}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-lo);margin-bottom:8px;}
.prog-track{height:6px;background:#efefeb;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);}

/* 質問 */
.q-sect{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:8px;opacity:.8;}
.q-text{font-size:18px;font-weight:900;color:var(--text-hi);line-height:1.45;margin-bottom:6px;}
.q-sub{display:none;}

/* 選択肢 */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.ch{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .15s;text-align:left;font-family:'Noto Sans JP',sans-serif;width:100%;min-height:56px;}
.ch:hover{border-color:var(--accent);background:var(--accent-light);}
.ch.sel{border-color:var(--accent);background:var(--accent-light);}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ch:hover .dot,.ch.sel .dot{border-color:var(--accent);}
.dot-in{width:9px;height:9px;border-radius:50%;background:var(--accent);display:none;}
.ch.sel .dot-in{display:block;}
.ch-text{flex:1;}
.ch-lbl{font-size:14px;font-weight:700;color:var(--text-hi);display:block;line-height:1.4;}
.ch-hint{display:none;}

/* ナビ */
.nav-btns{display:flex;gap:10px;align-items:center;}
.btn-next{padding:13px 28px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:10px;letter-spacing:.04em;transition:all .15s;box-shadow:0 4px 12px rgba(24,163,73,.3);}
.btn-next:hover{background:var(--accent-dark);box-shadow:0 6px 16px rgba(24,163,73,.4);}
.btn-next:disabled{opacity:.25;cursor:default;box-shadow:none;}
.btn-back{padding:13px 16px;border:1.5px solid var(--border);background:#fff;color:var(--text-lo);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:10px;transition:all .15s;}
.btn-back:hover{color:var(--text-mid);border-color:#bbb;}

/* ローディング */
.loading{text-align:center;padding:48px 0;}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.dots span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:dp 1.4s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.22s;}
.dots span:nth-child(3){animation-delay:.44s;}
@keyframes dp{0%,100%{opacity:.2;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
.loading p{font-size:13px;color:var(--text-lo);}

/* 結果 */
.result{animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.r-label{font-size:10px;letter-spacing:.14em;color:var(--text-lo);margin-bottom:10px;text-transform:uppercase;}
.type-badge-wrap{text-align:center;padding:28px 20px;border-radius:16px;margin-bottom:16px;}
.type-badge{display:inline-block;font-size:24px;font-weight:900;padding:10px 30px;border-radius:99px;border-width:2.5px;border-style:solid;margin-bottom:8px;letter-spacing:.02em;}
.type-en{font-size:11px;letter-spacing:.1em;margin-bottom:14px;opacity:.6;}
.type-desc{font-size:13px;line-height:1.9;text-align:left;max-width:460px;margin:0 auto;}
.innerdry-alert{background:#fffbea;border:1.5px solid #f5c400;border-radius:12px;padding:14px 18px;font-size:13px;color:#7a5e00;line-height:1.8;margin-bottom:16px;}
.axes-title{font-size:11px;color:#aaa;letter-spacing:.08em;margin-bottom:14px;font-weight:700;font-weight:700;}
.axis-row{margin-bottom:16px;}
.axis-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.axis-name{color:var(--text-hi);font-weight:500;}
.axis-val{color:var(--text-lo);font-weight:700;}
.axis-track{height:8px;background:#f0f0eb;border-radius:99px;overflow:hidden;}
.axis-fill{height:100%;border-radius:99px;transition:width .85s cubic-bezier(.4,0,.2,1);}
.ai-head{font-size:12px;color:var(--text-lo);letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-weight:700;}
.ai-pill{font-size:10px;background:var(--accent);color:#fff;padding:2px 9px;border-radius:4px;letter-spacing:.04em;}
.ai-body{font-size:13px;color:var(--text-mid);line-height:2;padding:16px 18px;background:#f8fdf9;border-radius:12px;border-left:4px solid var(--accent);white-space:pre-wrap;}
.r-actions{margin-top:20px;}
.btn-retry{padding:11px 20px;border:1.5px solid var(--border);background:#fff;color:var(--text-lo);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:10px;transition:all .15s;}
.btn-retry:hover{color:var(--text-mid);border-color:#aaa;}
.sec-div{height:1px;background:var(--border);margin:22px 0;}

/* フッター */
footer{border-top:1px solid var(--border);background:#fff;padding:28px 20px;text-align:center;}
.foot-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--text-lo);margin-bottom:6px;}
.foot-txt{font-size:11px;color:#ccc;line-height:1.8;}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="logo" href="#">MENS BIYOU ZUKAN <span>肌診断</span></a>
    <span class="nav-badge">無料 · 12問</span>
  </div>
</nav>

<div class="hero">
  <p class="hero-eye">Skin Type Diagnosis</p>
  <h1><em>本当の肌タイプ</em>を<br>12問で正確に診断する</h1>
  <p class="hero-sub">皮脂・水分・バリア・敏感度を独立スコアリング。インナードライや敏感ニキビ肌も見逃さない。</p>
  <div class="hero-tags">
    <span class="htag hi">8タイプ判定</span>
    <span class="htag hi">多軸スコア</span>
    <span class="htag hi">ビジュアル結果</span>
    <span class="htag">登録不要</span>
    <span class="htag">約3分</span>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-title">プロレベルの肌質診断</div>
    <div class="card-desc">皮脂・水分・バリア・敏感度を5軸で評価。8タイプから最も近い肌質を特定します。</div>
    <div class="prog-wrap">
      <div class="prog-meta">
        <span id="prog-label">質問 1 / 12</span>
        <span id="prog-sect">皮脂分泌</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:5%"></div></div>
    </div>
    <div id="q-area"></div>
  </div>
</div>

<footer>
  <div class="foot-logo">MENS BIYOU ZUKAN</div>
  <p class="foot-txt">本診断は一般的な美容情報に基づく参考情報です。医療的な診断ではありません。</p>
</footer>

<script>
/* ═══════════════════════════════════════
   12問 × 多軸スコアリング設計
   各質問が独立した軸に貢献する
═══════════════════════════════════════ */
/* ═══════════════════════════════════════
   皮膚科学ベース 12問診断
   根拠：Baumann Skin Type Questionnaire
        + 日本皮膚科学会ガイドライン
        + TEWL（経皮水分蒸散量）概念
   各軸に医学的重み(weight)を付与
═══════════════════════════════════════ */
const QS = [

  // ── 軸1: 皮脂分泌量（Sebum Production）──
  // 根拠：皮脂腺の分泌量は日内変動があるため
  //       起床直後の未スキンケア状態が最も正確
  {
    id:'q1', sect:'皮脂分泌 — 起床直後', lbl:'Q1 / 12',
    q:'朝起きてすぐ（洗顔前）、ティッシュを額と鼻に軽く当てるとどうなる？',
    sub:'実際に試してみてください。スキンケア前・洗顔前の素の状態が重要です。',
    axis:'sebum', weight:3,
    ch:[
      {l:'ほぼ何もつかない', h:'皮脂分泌が少ない（乾燥傾向）', v:0},
      {l:'うっすら半透明になる程度', h:'皮脂量は正常範囲', v:1},
      {l:'はっきり半透明〜油っぽくなる', h:'皮脂分泌がやや多い', v:2},
      {l:'べったり油がつく', h:'皮脂分泌が過剰（日本皮膚科学会基準：脂性肌）', v:3},
    ]
  },
  {
    id:'q2', sect:'皮脂分泌 — 日中変化', lbl:'Q2 / 12',
    q:'洗顔・スキンケア後、何時間くらいでテカりが気になりはじめる？',
    sub:'皮脂の再分泌速度はセバメーター測定値と高い相関があります。',
    axis:'sebum_rate', weight:2,
    ch:[
      {l:'1日中ほぼテカらない', h:'皮脂再分泌が少ない', v:0},
      {l:'夕方ごろ（6〜8時間後）に少しテカる', h:'皮脂分泌は正常', v:1},
      {l:'昼ごろ（3〜5時間後）にはテカる', h:'皮脂再分泌がやや速い', v:2},
      {l:'2時間以内にもうテカっている', h:'皮脂腺の活動が活発（脂性肌の指標）', v:3},
    ]
  },

  // ── 軸2: 角層水分量・TEWL（バリア機能）──
  // 根拠：Corneometerによる角層水分量測定の
  //       代替として「洗顔後放置テスト」を使用
  //       （皮膚科の問診でも標準的に使われる方法）
  {
    id:'q3', sect:'角層水分量 — 洗顔後テスト', lbl:'Q3 / 12',
    q:'洗顔後、何もつけず自然乾燥させると何分でつっぱりを感じる？',
    sub:'このテストは角層水分量（Corneometer値）と相関することが研究で確認されています。',
    axis:'tewl', weight:3,
    ch:[
      {l:'3分以内にかなり強いつっぱり', h:'角層水分量が著しく低下（乾燥肌の基準値以下）', v:0},
      {l:'5〜10分でじわじわつっぱる', h:'角層水分量がやや低め', v:1},
      {l:'20分以上経っても快適', h:'角層水分量は正常範囲', v:2},
      {l:'つっぱらない。むしろ時間とともにテカる', h:'皮脂分泌が水分蒸発を補っている', v:3},
    ]
  },
  {
    id:'q4', sect:'バリア機能 — TEWL間接評価', lbl:'Q4 / 12',
    q:'化粧水をつけた直後はしっとりするのに、30分〜1時間後には乾燥する？',
    sub:'水分が早期に蒸発する＝TEWL（経皮水分蒸散量）が高い＝バリア機能低下のサインです。',
    axis:'barrier', weight:3,
    ch:[
      {l:'しっとりが数時間持続する', h:'バリア機能が正常（TEWL低値）', v:0},
      {l:'1〜2時間で乾燥を感じる', h:'バリア機能がやや低下', v:1},
      {l:'30分以内にまた乾燥する', h:'バリア機能が低下（TEWL高値の可能性）', v:2},
      {l:'そもそも化粧水を使っていない', h:'評価不能（スキンケア習慣なし）', v:-1},
    ]
  },

  // ── 軸3: 部位別皮脂分布（混合肌診断）──
  // 根拠：皮脂腺の分布密度はTゾーンで最大
  //       （約400〜900個/cm²）、頬では少ない
  //       この生理学的差異が混合肌を生む
  {
    id:'q5', sect:'部位別皮脂分布 — T/Uゾーン', lbl:'Q5 / 12',
    q:'おでこ・鼻（Tゾーン）と頬・あご（Uゾーン）の皮脂量の差は？',
    sub:'Tゾーンは皮脂腺密度が最大4倍高く、部位差が大きいほど混合肌の可能性が高まります。',
    axis:'zone', weight:3,
    ch:[
      {l:'頬もおでこも同じくらいカサカサする', h:'全体的に乾燥傾向', v:0},
      {l:'全体的に均一でほとんど差がない', h:'均一な皮脂分布', v:1},
      {l:'Tゾーンだけ明らかにテカり、頬は乾燥〜普通', h:'典型的な混合肌パターン（皮脂腺密度差）', v:2},
      {l:'Tゾーンが激しくテカり、頬もある程度テカる', h:'全体的に皮脂過多だがT優位', v:3},
    ]
  },

  // ── 軸4: 皮膚感受性・炎症性（敏感肌診断）──
  // 根拠：Favre教授の敏感肌定義
  //       「主観的な不快感（刺激感・灼熱感）を
  //       引き起こしやすい状態」+ IgE非依存性
  {
    id:'q6', sect:'皮膚感受性 — 刺激反応', lbl:'Q6 / 12',
    q:'新しいスキンケア製品を使ったとき、ヒリヒリ・赤み・かゆみが出やすい？',
    sub:'敏感肌の医学的定義は「正常なら刺激にならない物質に対して過剰反応する状態」です。',
    axis:'sensitivity', weight:3,
    ch:[
      {l:'ほとんど反応しない', h:'皮膚感受性が正常', v:0},
      {l:'強い製品（アルコール・レチノール等）では少し出る', h:'やや感受性高め（正常範囲内）', v:1},
      {l:'普通の化粧水でもたまにヒリヒリする', h:'皮膚感受性が高い（敏感肌の可能性）', v:2},
      {l:'多くのものでヒリヒリ・赤み・かゆみが出る', h:'高感受性肌（敏感肌診断基準を満たす）', v:3},
    ]
  },
  {
    id:'q7', sect:'皮膚感受性 — 物理的刺激', lbl:'Q7 / 12',
    q:'タオルで顔を拭いた後、赤みや熱感が残ることがある？',
    sub:'物理的摩擦への反応はバリア機能とニューロセンシティビティ（神経感受性）の指標です。',
    axis:'phys_sens', weight:2,
    ch:[
      {l:'全くない', h:'物理的バリアが正常', v:0},
      {l:'強く拭いたときだけ少し赤くなる', h:'軽度の感受性', v:1},
      {l:'普通に拭いても赤みや熱感が残る', h:'バリア機能低下のサイン', v:2},
      {l:'すぐ赤くなってしばらく治まらない', h:'毛細血管拡張・神経感受性亢進の可能性', v:3},
    ]
  },

  // ── 軸5: 炎症・ニキビ（アクネ診断）──
  // 根拠：日本皮膚科学会「尋常性痤瘡治療ガイドライン」
  //       Grade I〜IVの重症度分類に準拠した質問設計
  {
    id:'q8', sect:'炎症・ニキビ重症度', lbl:'Q8 / 12',
    q:'ニキビ（白ニキビ・黒ニキビ・赤ニキビ）の状態は？',
    sub:'日本皮膚科学会のニキビ重症度分類（Grade I〜IV）に基づいて選んでください。',
    axis:'acne', weight:2,
    ch:[
      {l:'ほぼ出ない（年に数個程度）', h:'Grade I 相当：軽微', v:0},
      {l:'月に1〜3個程度、小さな白・黒ニキビが主', h:'Grade I〜II 相当：軽症', v:1},
      {l:'常に5個以上。赤く炎症したニキビも出る', h:'Grade II〜III 相当：中等症', v:2},
      {l:'多数かつ慢性的。膿を持つ大きなニキビも出る', h:'Grade III〜IV 相当：重症（皮膚科受診を推奨）', v:3},
    ]
  },

  // ── 軸6: インナードライ複合評価 ──
  // 根拠：インナードライは単一症状では診断できない
  //       「皮脂分泌↑」×「角層水分量↓」の
  //       矛盾した組み合わせを複数質問で確認する
  {
    id:'q9', sect:'インナードライ — 矛盾症状確認', lbl:'Q9 / 12',
    q:'次のうち、自分に当てはまるものをすべて選ぶとしたら？（最も近い1つを選択）',
    sub:'インナードライは「皮脂過多」と「水分不足」が同時に起きる状態。矛盾症状の数が多いほど可能性大。',
    axis:'innerdry', weight:3,
    ch:[
      {l:'テカるし、乾燥もする。どちらも気になる', h:'矛盾症状が両立 → インナードライの強いサイン', v:3},
      {l:'テカりはあるが乾燥はほぼ感じない', h:'皮脂過多のみ → 脂性肌の可能性', v:1},
      {l:'乾燥はあるがテカりはほぼない', h:'水分不足のみ → 乾燥肌の可能性', v:0},
      {l:'どちらも特に気にならない', h:'バランス型', v:0},
    ]
  },
  {
    id:'q10', sect:'インナードライ — 洗顔後の矛盾反応', lbl:'Q10 / 12',
    q:'洗顔後しばらくは乾燥するが、時間が経つとテカってくる？',

/* ═══════════════════════════════════════
   スコア計算・タイプ判定
═══════════════════════════════════════ */
/* ═══════════════════════════════════════
   皮膚科学ベース スコアリングエンジン
   各軸を独立して評価し、重み付き合算で判定
═══════════════════════════════════════ */
function calcScores(ans){
  const r = {};
  QS.forEach(q=>{
    if(ans[q.id] !== undefined){
      const v = q.ch[ans[q.id]].v;
      if(v >= 0) r[q.axis] = {v, w: q.weight};
    }
  });

  // ── 皮脂スコア（重み付き平均）
  // sebum(w3) + sebum_rate(w2) を統合
  const sebumRaw = ((r.sebum?.v??0)*3 + (r.sebum_rate?.v??0)*2) / 5;

  // ── 乾燥・バリアスコア
  // TEWL(w3) + barrier(w3) を統合。v=-1は除外
  const tewlV    = r.tewl?.v ?? 1;
  const barrierV = r.barrier?.v === -1 ? 1 : (r.barrier?.v ?? 1);
  // 乾燥方向に変換（低v=高乾燥）
  const dryRaw   = ((3-tewlV)*3 + (barrierV<=1?3-barrierV:0)*3) / 6;

  // ── 部位差スコア（zone）
  const zoneV = r.zone?.v ?? 1;

  // ── 感受性スコア（sensitivity + phys_sens 重み付き）
  const sensRaw = ((r.sensitivity?.v??0)*3 + (r.phys_sens?.v??0)*2) / 5;

  // ── ニキビスコア
  const acneV = r.acne?.v ?? 0;

  // ── インナードライスコア（2問の複合判定）
  // innerdry(w3) + innerdry2(w3) を合算
  const idV1 = r.innerdry?.v ?? 0;   // 0〜3
  const idV2 = r.innerdry2?.v ?? 0;  // 0〜3
  const innerdryScore = (idV1 * 3 + idV2 * 3) / 6; // 0〜3

  // ── 色素沈着
  const pigmentV = r.pigment?.v ?? 0;

  // ── 生活習慣（補正因子）
  const lifestyleV = r.lifestyle?.v ?? 1;
  // 生活習慣が悪いと乾燥・皮脂スコアを補正
  const lifeCorr = lifestyleV === 0 ? 0.3 : lifestyleV === 1 ? 0.1 : 0;

  // ── 表示用スコア（0〜100%）
  const sebumPct   = Math.min(Math.round((sebumRaw / 3) * 100), 100);
  const dryPct     = Math.min(Math.round((dryRaw   / 3) * 100 + lifeCorr*15), 100);
  const sensPct    = Math.min(Math.round((sensRaw   / 3) * 100), 100);
  const acnePct    = Math.min(Math.round((acneV     / 3) * 100), 100);
  const barrierPct = Math.max(0, Math.min(Math.round(100 - dryPct*0.6 - sensPct*0.3), 100));
  const lifePct    = Math.round((lifestyleV / 3) * 100);

  return {
    sebumRaw, dryRaw, zoneV, sensRaw, acneV,
    innerdryScore, pigmentV, lifestyleV,
    axes:{ sebumPct, dryPct, sensPct, acnePct, barrierPct, lifePct }
  };
}

function classifyType(sc){
  const {sebumRaw, dryRaw, zoneV, sensRaw, acneV, innerdryScore} = sc;

  // ── インナードライ判定（複合スコア閾値）
  // 2問の重み付き合算 ≥ 2 かつ 皮脂高め かつ 乾燥あり
  const isInnerdry = innerdryScore >= 2 && sebumRaw >= 1.5 && dryRaw >= 1;

  // ── 敏感肌判定（感受性スコア閾値）
  const isSensitive = sensRaw >= 1.8;

  // ── ニキビ判定
  const hasAcne = acneV >= 2;

  // ── 混合肌判定（部位差）
  const isCombo = zoneV === 2;

  // ── 脂性判定
  const isOily = sebumRaw >= 2;

  // ── 乾燥判定
  const isDry = dryRaw >= 2;

  /* 判定ツリー（医学的優先順位）
     1. インナードライ（最も見逃されやすく重要）
     2. 敏感ニキビ（ケア方針が真逆になるため分離必須）
     3. 敏感肌
     4. 脂性ニキビ
     5. 混合肌
     6. 脂性肌
     7. 乾燥肌
     8. 普通肌                              */
  if(isInnerdry)                        return TYPES.innerdry;
  if(isSensitive && hasAcne)            return TYPES.sensitive_acne;
  if(isSensitive)                       return TYPES.sensitive;
  if(isOily && hasAcne)                 return TYPES.oily_acne;
  if(isCombo)                           return TYPES.combo;
  if(isOily)                            return TYPES.oily;
  if(isDry)                             return TYPES.dry;
  return TYPES.normal;
}

let ans = {}, cur = 0;

function renderQ(i){
  const q = QS[i];
  const pct = Math.round((i / QS.length) * 100) + 5;
  document.getElementById('prog-fill').style.width = Math.min(pct, 95) + '%';
  document.getElementById('prog-label').textContent = `質問 ${i+1} / ${QS.length}`;
  document.getElementById('prog-sect').textContent  = q.sect;

  const sel = ans[q.id];
  const isLast = i === QS.length - 1;

  document.getElementById('q-area').innerHTML = `
    <div style="animation:fadeUp .28s ease">
      <div class="q-sect">${q.sect}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-sub">${q.sub}</div>
      <div class="choices">
        ${q.ch.map((c,ci) => `
          <button class="ch ${sel===ci?'sel':''}" id="ch${ci}" onclick="pick('${q.id}',${ci},${q.ch.length})">
            <div class="dot"><div class="dot-in"></div></div>
            <div class="ch-text">
              <span class="ch-lbl">${c.l}</span>
              ${c.h?`<span class="ch-hint">${c.h}</span>`:''}
            </div>
          </button>`).join('')}
      </div>
      <div class="nav-btns">
        ${i>0?'<button class="btn-back" onclick="goBack()">← 戻る</button>':''}
        <button class="btn-next" id="btn-next" onclick="goNext()" ${sel!==undefined?'':'disabled'}>
          ${isLast ? '診断する →' : '次へ →'}
        </button>
      </div>
    </div>`;
}

function pick(qid, ci, total){
  ans[qid] = ci;
  for(let i=0;i<total;i++) document.getElementById('ch'+i)?.classList.remove('sel');
  document.getElementById('ch'+ci)?.classList.add('sel');
  document.getElementById('btn-next').disabled = false;
}
function goNext(){
  if(ans[QS[cur].id] === undefined) return;
  cur++;
  if(cur >= QS.length) showLoading();
  else renderQ(cur);
}
function goBack(){
  if(cur > 0){ cur--; renderQ(cur); }
}

function showLoading(){
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = '分析中…';
  document.getElementById('prog-sect').textContent  = '';
  document.getElementById('q-area').innerHTML = `
    <div class="loading">
      <div class="dots"><span></span><span></span><span></span></div>
      <p>肌質を多軸で分析しています…</p>
    </div>`;
  setTimeout(showResult, 1300);
}

function drawRadar(canvasId, scores){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2, r = cx - 36;
  const labels = ['皮脂','乾燥','感受性','ニキビ','バリア','生活'];
  const vals   = scores; // 0〜100
  const N = labels.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // グリッド
  [0.25,0.5,0.75,1].forEach(ratio=>{
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const angle = (Math.PI*2/N)*i - Math.PI/2;
      const x = cx + r*ratio*Math.cos(angle);
      const y = cy + r*ratio*Math.sin(angle);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e8e8e4';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // 軸線
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(angle), cy+r*Math.sin(angle));
    ctx.strokeStyle='#e8e8e4';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // データ塗り
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const v = vals[i]/100;
    const x = cx + r*v*Math.cos(angle);
    const y = cy + r*v*Math.sin(angle);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(24,163,73,.15)';
  ctx.fill();
  ctx.strokeStyle = '#1db954';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 頂点ドット
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const v = vals[i]/100;
    ctx.beginPath();
    ctx.arc(cx+r*v*Math.cos(angle), cy+r*v*Math.sin(angle), 4,0,Math.PI*2);
    ctx.fillStyle='#1db954';
    ctx.fill();
  }

  // ラベル
  ctx.font = '500 11px Noto Sans JP, sans-serif';
  ctx.fillStyle = '#999';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0;i<N;i++){
    const angle = (Math.PI*2/N)*i - Math.PI/2;
    const lx = cx + (r+22)*Math.cos(angle);
    const ly = cy + (r+22)*Math.sin(angle);
    ctx.fillText(labels[i], lx, ly);
  }
}

function drawSkinMap(canvasId, sc){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // 顔のシルエット（楕円）
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.48, w*0.34, h*0.44, 0, 0, Math.PI*2);
  ctx.strokeStyle='#ccc';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle='rgba(240,240,235,.8)';
  ctx.fill();

  function heatColor(v, alpha){
    if(v>66) return `rgba(29,185,84,${alpha})`;   // 良好：緑
    if(v>33) return `rgba(245,196,0,${alpha})`;   // 中間：黄
    return `rgba(248,113,113,${alpha})`;           // 要注意：赤
  }

  // Tゾーン（おでこ〜鼻）
  const tScore = 100 - sc.axes.sebumPct; // 低皮脂=良い
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.3, w*0.13, h*0.12, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(tScore, 0.55);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.52, w*0.07, h*0.1, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(tScore, 0.55);
  ctx.fill();

  // Uゾーン（頬）
  const uScore = 100 - sc.axes.dryPct;
  ctx.beginPath();
  ctx.ellipse(w*0.33, h*0.52, w*0.1, h*0.13, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(uScore, 0.55);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w*0.67, h*0.52, w*0.1, h*0.13, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(uScore, 0.55);
  ctx.fill();

  // あご
  const chinScore = 100 - Math.max(sc.axes.sebumPct, sc.axes.dryPct)/2;
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.78, w*0.1, h*0.07, 0, 0, Math.PI*2);
  ctx.fillStyle = heatColor(chinScore, 0.45);
  ctx.fill();

  // ラベル
  ctx.font = '700 10px Noto Sans JP, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#555';
  ctx.fillText('Tゾーン', w/2, h*0.18);
  ctx.fillText('頬(L)', w*0.16, h*0.52);
  ctx.fillText('頬(R)', w*0.84, h*0.52);
  ctx.fillText('あご', w/2, h*0.91);

  // 凡例
  ctx.font='9px Noto Sans JP, sans-serif';
  [[29,185,84,'良好'],[245,196,0,'注意'],[248,113,113,'要ケア']].forEach(([r,g,b,t],i)=>{
    const lx=6, ly=h-38+i*13;
    ctx.fillStyle=`rgba(${r},${g},${b},.8)`;
    ctx.fillRect(lx,ly,8,8);
    ctx.fillStyle='#999';
    ctx.textAlign='left';
    ctx.fillText(t,lx+11,ly+7);
  });
}

function fetchAdvice(type, sc){
  const ADVICE = {
    innerdry:`今すぐやめるべきは「皮脂が多いから」という理由での洗顔回数の増加と、ノンオイル・さっぱり系だけで済ませるケアです。インナードライは表面の油分に騙されがちですが、肌の内側は水分不足の状態。最優先ケアは化粧水をたっぷり重ねづけして水分を補給すること。成分はヒアルロン酸・グリセリン・セラミドを含む水分重視の化粧水を選び、テクスチャーはさっぱり〜普通タイプが合います。乳液で蓋をすることも忘れずに。1ヶ月続ければテカりが落ち着いてくる人が多く、「テカるから何もしない」から「保湿するからテカらない」へと体感が変わっていきます。`,

    oily_acne:`最優先は洗顔の見直しです。皮脂を落とそうと1日3回以上洗顔している人は今日から朝晩2回に抑えてください。洗いすぎがバリアを壊し、さらに皮脂を分泌させる悪循環を生んでいます。化粧水は薬用（医薬部外品）表記があり、グリチルリチン酸・サリチル酸・ビタミンC誘導体のいずれかを含むさっぱりタイプを選んでください。高粘度のとろみ系・ヒアルロン酸系は毛穴を詰まらせるリスクがあるので今は避けましょう。1ヶ月後には毛穴のつまりが減り、ニキビの頻度が明らかに落ちている状態を目指せます。`,

    sensitive_acne:`刺激を与えないことが最大の優先事項です。アルコール・香料・着色料が入った化粧水は今すぐ使用を中断してください。ニキビがあっても敏感肌の場合、薬用成分の刺激で肌がさらに荒れることがあります。低刺激処方（アルコールフリー・無香料・無着色）でありながらニキビケア成分（グリチルリチン酸・ティーツリー）を含む化粧水を探しましょう。洗顔は摩擦ゼロを意識し、泡で包むように優しく洗うことが基本です。1ヶ月で赤みと肌荒れが落ち着き、ニキビができにくい土台ができていきます。`,

    sensitive:`バリア機能の回復が最優先です。今使っている化粧水の成分表を確認し、エタノール（アルコール）が上位に記載されているなら切り替えを検討してください。セラミド・コラーゲン・ナイアシンアミドなどバリア補強成分を含む低刺激処方が最適です。洗顔は朝は水洗いのみにする方法も有効で、摩擦を極力ゼロにすることが回復への近道。テクスチャーはとろみのあるしっとりタイプが肌に密着しやすく、揮発による乾燥も防げます。1ヶ月でヒリヒリ・赤みの頻度が明らかに減少していきます。`,

    combo:`部位別ケアへの切り替えが最も効果的です。Tゾーン（おでこ・鼻）にはさっぱり系・皮脂ケア成分入りを少量、Uゾーン（頬・あご）には保湿系をたっぷりと使い分けてください。同じ化粧水を全顔に同量塗るのが混合肌の最大のNGです。1本で済ませたい場合はバランス型の化粧水（IPSAのタイムRアクアなど混合肌向け設計）を選びましょう。成分はBHA（サリチル酸）配合でテクスチャーが軽めのものを。1ヶ月後にはTゾーンのテカりが抑えられ、頬の乾燥感もなくなったバランスの取れた肌になれます。`,

    oily:`洗顔の質と回数を整えることが第一歩です。現在1日3回以上洗顔している場合は朝晩2回に削減してください。化粧水はさっぱりタイプで皮脂ケア成分（BHA・ナイアシンアミド・ビタミンC誘導体）入りを選びましょう。「油分カット＝正解」ではなく、適切な保湿で皮脂の過剰分泌を抑えるのが本来のアプローチです。テクスチャーは水のようなローションタイプが肌に負担なく使えます。毛穴が気になる場合は週1〜2回の酵素洗顔を追加すると詰まりが取れやすくなります。1ヶ月でテカりのピークタイムが遅くなり、昼にベタつく時間が短くなっていきます。`,

    dry:`水分補給を最優先にしたルーティン構築が急務です。現在「保湿が足りていない」と体が感じているサインがつっぱりとして出ています。化粧水はヒアルロン酸・セラミド・コラーゲンを含む高保湿タイプを選び、1回の量をケチらず500円玉大をたっぷり使ってください。その後に乳液またはクリームで蓋をする2ステップが乾燥肌には必須です。洗顔は泡立てた泡で優しく洗い、すすぎはぬるま湯で。熱いお湯は皮脂を落としすぎるので避けましょう。1ヶ月でつっぱり感が朝からなくなり、肌のキメが整ってくる変化を実感できます。`,

    normal:`現状の維持と将来への先行投資が鍵です。今の肌バランスを崩さないよう、スキンケアをシンプルに継続することが最も重要。余裕があればビタミンC誘導体入りの化粧水を取り入れると、毛穴・くすみ・シミの予防効果が期待できます。特に20代のうちからUVケア（日焼け止め）を習慣にすることで、30代以降の肌の差が劇的に変わります。保湿は化粧水＋乳液の2ステップをベースに、乾燥を感じる日は量を増やす柔軟な対応を。1ヶ月後の変化は見えにくいですが、継続することで3ヶ月後・1年後に「やっておいてよかった」と感じる肌になれます。`,
  };

  // typeのkeyを特定
  const key = Object.keys(TYPES).find(k => TYPES[k] === type) || 'normal';

  // 生活習慣スコアが低い場合の追記
  let extra = '';
  if(sc.lifestyle <= 1){
    extra = '\n\nまた、睡眠不足と水分不足は皮脂分泌の乱れとバリア機能低下に直結します。睡眠7時間・水分1.5L/日を意識するだけで、ケアの効果が2倍以上変わります。';
  }

  document.getElementById('ai-box').textContent = (ADVICE[key] || ADVICE.normal) + extra;
}

function restart(){
  ans = {}; cur = 0;
  document.getElementById('prog-fill').style.width = '5%';
  document.getElementById('prog-label').textContent = '質問 1 / 12';
  document.getElementById('prog-sect').textContent = QS[0].sect;
  renderQ(0);
}

renderQ(0);
</script>
